<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sebastián Lardelli | Desarrollador Backend — Ingeniería en Sistemas, PHP, Node.js</title>
    <meta
      name="description"
      content="Desarrollador de software en Rosario. Últimos años de Ingeniería en Sistemas Informáticos (UAI). APIs REST en PHP Slim y Node.js, Express y TypeScript. E-commerce en producción, autenticación JWT, Docker, RAG e IA. Portfolio de Sebastián Lardelli."
    />
    <script>
      (function () {
        var stored = localStorage.getItem("theme");
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (stored === "dark" || (!stored && prefersDark)) {
          document.documentElement.classList.add("dark");
        }
        var locale = localStorage.getItem("locale");
        if (locale === "en" || locale === "es") {
          document.documentElement.lang = locale;
        } else if (navigator.language && navigator.language.toLowerCase().indexOf("en") === 0) {
          document.documentElement.lang = "en";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
